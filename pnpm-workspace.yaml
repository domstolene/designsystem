packages:
  - 'packages/*'

strictPeerDependencies: false
autoInstallPeers: true
enablePrePostScripts: true

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true

overrides:
  react: 19.3.1
  react-dom: 19.3.1
  typed-css-modules>glob: 14.0.6
  glob@>=13.0.0 <14.0.4: ^14.0.4
  minimatch@>=10.0.0 <11.0.7: ^11.0.7
