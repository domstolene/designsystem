packages:
  - 'packages/*'

strictPeerDependencies: false
autoInstallPeers: true
enablePrePostScripts: true

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true

overrides:
  react: 19.2.8
  react-dom: 19.2.8
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  immutable@>=5.0.0-beta.1 <5.1.8: ^5.1.8

minimumReleaseAgeExclude:
  - esbuild@0.28.1
  - js-yaml@4.1.2 || 4.3.0 || 4.3.1
  - brace-expansion@1.1.16 || 1.1.17 || 1.1.18 || 2.1.2 || 2.1.3 || 2.1.4 || 5.0.8 || 5.0.9
  - immutable@5.1.8
  - fast-uri@3.1.5
